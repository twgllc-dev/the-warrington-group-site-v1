<svg viewBox="0 0 1920 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232120"/>
      <stop offset="55%" stop-color="#2E2B27"/>
      <stop offset="100%" stop-color="#38332C"/>
    </linearGradient>

    <linearGradient id="textShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#171614" stop-opacity="0.88"/>
      <stop offset="42%" stop-color="#1D1B18" stop-opacity="0.64"/>
      <stop offset="70%" stop-color="#1D1B18" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1D1B18" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="78%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#4A4238" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1920" height="800" fill="url(#base)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>
  <rect width="1920" height="800" fill="url(#glow)"/>

  <!-- schema network: nodes + edges, concentrated right two-thirds -->
  <g stroke="#D4AF37" stroke-width="1.4" opacity="0.55">
    <line x1="980" y1="180" x2="1160" y2="120"/>
    <line x1="1160" y1="120" x2="1360" y2="170"/>
    <line x1="1160" y1="120" x2="1240" y2="300"/>
    <line x1="1360" y1="170" x2="1560" y2="140"/>
    <line x1="1360" y1="170" x2="1440" y2="340"/>
    <line x1="1240" y1="300" x2="1440" y2="340"/>
    <line x1="1440" y1="340" x2="1660" y2="380"/>
    <line x1="1660" y1="380" x2="1780" y2="260"/>
    <line x1="1780" y1="260" x2="1900" y2="320"/>
    <line x1="1240" y1="300" x2="1180" y2="480"/>
    <line x1="1180" y1="480" x2="1380" y2="560"/>
    <line x1="1380" y1="560" x2="1440" y2="340"/>
    <line x1="1380" y1="560" x2="1600" y2="620"/>
    <line x1="1600" y1="620" x2="1660" y2="380"/>
    <line x1="1600" y1="620" x2="1820" y2="600"/>
    <line x1="1780" y1="260" x2="1900" y2="180"/>
    <line x1="1180" y1="480" x2="1020" y2="560"/>
    <line x1="1020" y1="560" x2="1160" y2="680"/>
    <line x1="1160" y1="680" x2="1380" y2="560"/>
  </g>

  <g stroke="#B8934A" stroke-width="1.2" opacity="0.4">
    <line x1="1560" y1="140" x2="1700" y2="80"/>
    <line x1="1900" y1="320" x2="1900" y2="480"/>
    <line x1="1820" y1="600" x2="1900" y2="700"/>
    <line x1="1020" y1="560" x2="900" y2="640"/>
  </g>

  <!-- nodes -->
  <g fill="#D4AF37">
    <circle cx="980" cy="180" r="4" opacity="0.75"/>
    <circle cx="1160" cy="120" r="5" opacity="0.9"/>
    <circle cx="1360" cy="170" r="4" opacity="0.75"/>
    <circle cx="1240" cy="300" r="6" opacity="0.95"/>
    <circle cx="1560" cy="140" r="4" opacity="0.65"/>
    <circle cx="1440" cy="340" r="6" opacity="0.95"/>
    <circle cx="1660" cy="380" r="5" opacity="0.85"/>
    <circle cx="1780" cy="260" r="4" opacity="0.75"/>
    <circle cx="1900" cy="320" r="4" opacity="0.65"/>
    <circle cx="1180" cy="480" r="5" opacity="0.85"/>
    <circle cx="1380" cy="560" r="6" opacity="0.95"/>
    <circle cx="1600" cy="620" r="5" opacity="0.85"/>
    <circle cx="1820" cy="600" r="4" opacity="0.65"/>
    <circle cx="1020" cy="560" r="4" opacity="0.75"/>
    <circle cx="1160" cy="680" r="4" opacity="0.65"/>
    <circle cx="1900" cy="180" r="3" opacity="0.55"/>
  </g>
  <g fill="#F1D67A">
    <circle cx="1700" cy="80" r="3" opacity="0.7"/>
    <circle cx="1900" cy="480" r="3" opacity="0.55"/>
    <circle cx="1900" cy="700" r="3" opacity="0.55"/>
    <circle cx="900" cy="640" r="3" opacity="0.6"/>
  </g>

  <!-- faint scattered nodes across full field for texture -->
  <g fill="#514A3E">
    <circle cx="140" cy="90" r="3"/>
    <circle cx="320" cy="220" r="2.5"/>
    <circle cx="220" cy="420" r="3"/>
    <circle cx="80" cy="600" r="2.5"/>
    <circle cx="420" cy="700" r="3"/>
    <circle cx="600" cy="80" r="2.5"/>
    <circle cx="700" cy="520" r="3"/>
  </g>

  <!-- left-side shade so overlaid text stays legible -->
  <rect width="1920" height="800" fill="url(#textShade)"/>
</svg>
